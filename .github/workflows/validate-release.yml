name: Validate and package

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install validators
        run: |
          npm ci
          npm install --global @anthropic-ai/claude-code@2.1.241

      - name: Validate shared distribution
        run: npm run check

      - name: Validate Anthropic plugin
        run: claude plugin validate . --strict

      - name: Validate Skills.sh discovery
        run: npx --yes skills@latest add . --list

      - name: Build provider archives
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: vibeco-plugin-packages
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vibeco-plugin-packages
          path: dist

      - name: Verify tag matches plugin version
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version .codex-plugin/plugin.json)"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
